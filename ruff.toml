target-version = "py311"
line-length = 120
extend-exclude = ["dashboard", ".venv", "scripts/dev_console.py", "alembic/versions/000[1-5]_*.py"]

[lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E501",   # long lines are handled case by case
  "B008",   # FastAPI's Depends() in defaults is idiomatic
]

[lint.isort]
known-first-party = [
  "access", "app_config", "auth", "config", "crypto", "database", "enums",
  "github_client", "models", "redis_util", "routers", "schemas", "worker",
]
known-third-party = ["alembic"]
