services:
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    working_dir: /app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an
      # Ollama running on the host (automatic on macOS, needed on Linux).
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    extra_hosts:
      # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an
      # Ollama running on the host (automatic on macOS, needed on Linux).
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: python -m arq worker.queue.WorkerSettings

  # Redis and Postgres are reachable only on the compose network — no host
  # ports. Uncomment a "127.0.0.1:..." mapping if you need local access.
  redis:
    image: redis:7-alpine
    # ports:
    #   - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: Custos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Custos}
      POSTGRES_DB: Custos
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Custos"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
