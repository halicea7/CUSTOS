# Production-style stack. Copy api/.env.example to .env and fill in the
# secrets first; Postgres and Redis are only reachable on the internal network.

x-backend-env: &backend-env
  env_file: .env
  extra_hosts:
    # OLLAMA_BASE_URL=http://host.docker.internal:11434 reaches an Ollama on
    # the Docker host (automatic on macOS/Windows, needs this on Linux).
    - "host.docker.internal:host-gateway"
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-custos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-custos}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

services:
  migrate:
    <<: *backend-env
    build: { context: ., target: api }
    working_dir: /srv/custos
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend-env
    build: { context: ., target: api }
    # Bound to localhost only: the dashboard's nginx is the public entry point.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    <<: *backend-env
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    tmpfs:
      - /tmp/Custos_clones:size=4g,mode=1777
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-custos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-custos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
