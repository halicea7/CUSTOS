name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: custos
          POSTGRES_PASSWORD: custos
          POSTGRES_DB: custos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U custos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://custos:custos@localhost:5432/custos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        working-directory: api
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://custos:custos@localhost:5432/custos_migrations
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef  # nosemgrep gitleaks:allow (dummy, CI only)
        run: |
          PGPASSWORD=custos psql -h localhost -U custos -d custos_test -c "CREATE DATABASE custos_migrations"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., target: api, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., target: worker, push: false, cache-from: type=gha }
      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ./dashboard, push: false }

  deploy:
    name: Deploy end to end (./custos deploy)
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy with the launcher, exactly as a user would
        run: ./custos --yes deploy

      - name: Generated .env is private and complete
        run: |
          test "$(stat -c %a .env)" = "600"
          grep -Eq '^SECRET_KEY=[0-9a-f]{64}$' .env
          grep -Eq '^ENCRYPTION_KEY=[A-Za-z0-9_-]{43}=$' .env
          grep -Eq '^POSTGRES_PASSWORD=[0-9a-f]{32}$' .env
          grep -Eq '^REDIS_PASSWORD=[0-9a-f]{32}$' .env

      # Note: `! cmd` never fails a step under `bash -e`, so use explicit ifs.
      - name: Scanners live only in the worker image; no secrets baked in
        run: |
          docker compose exec -T worker sh -c '
            git --version && gitleaks version && semgrep --version &&
            npm --version && python -m pip_audit --version &&
            test -x "$(command -v s1-cns-cli)" && test "$S1_HOME" = /var/lib/custos-s1'
          if docker compose exec -T api sh -c 'command -v git'; then
            echo "::error::git should not be in the api image"; exit 1
          fi
          for svc in api worker; do
            if docker compose exec -T "$svc" sh -c 'ls -a /srv/custos /srv/custos/api' | grep -qx '.env'; then
              echo "::error::.env baked into the $svc image"; exit 1
            fi
          done

      - name: Dashboard proxy, user creation and login work
        run: |
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/api/healthz
          echo 'ci-password-123' | ./custos user add ci --role admin
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-123"}' | grep -q access_token

      - name: Spoofed X-Forwarded-For cannot dodge the login rate limit
        run: |
          for i in $(seq 1 10); do
            curl -s -o /dev/null -X POST http://localhost:3000/api/auth/login \
              -H 'Content-Type: application/json' -H "X-Forwarded-For: 10.0.0.$i" \
              -d '{"username":"ci","password":"wrong-password"}'
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' -H 'X-Forwarded-For: 10.9.9.9' \
            -d '{"username":"ci","password":"ci-password-123"}')
          if [ "$code" != "429" ]; then
            echo "::error::expected 429 after 10 failures with rotating X-Forwarded-For, got $code"; exit 1
          fi

      - name: Only the dashboard is reachable from outside the host
        run: |
          IP=$(hostname -I | awk '{print $1}')
          for port in 8000 6379 5432; do
            if nc -z -w 2 "$IP" "$port"; then
              echo "::error::port $port is reachable on $IP"; exit 1
            fi
          done
          nc -z -w 2 "$IP" 3000

      - name: Re-running deploy is a safe upgrade
        run: |
          cp .env /tmp/env.before
          ./custos --yes deploy
          diff -q .env /tmp/env.before

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v || true
