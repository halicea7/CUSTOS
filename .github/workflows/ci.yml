name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: custos
          POSTGRES_PASSWORD: custos
          POSTGRES_DB: custos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U custos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://custos:custos@localhost:5432/custos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        working-directory: api
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://custos:custos@localhost:5432/custos_migrations
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
        run: |
          PGPASSWORD=custos psql -h localhost -U custos -d custos_test -c "CREATE DATABASE custos_migrations"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build worker image
        uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, cache-from: type=gha }
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with: { context: ./dashboard, push: false }
